name: Private Service Authority

on:
  pull_request:
    paths:
      - 'config/private-service-authority.v1.json'
      - 'scripts/validate_private_service_authority.py'
      - 'README.md'
      - 'REPO_AUTHORITY.md'
      - 'docs/**'
      - '.github/workflows/private-service-authority.yml'
  push:
    branches:
      - main
    paths:
      - 'config/private-service-authority.v1.json'
      - 'scripts/validate_private_service_authority.py'
      - 'README.md'
      - 'REPO_AUTHORITY.md'
      - 'docs/**'
      - '.github/workflows/private-service-authority.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_private_service_authority.py
