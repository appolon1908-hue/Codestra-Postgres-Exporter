name: Codestra PostgreSQL Exporter Source Sync

on:
  push:
    branches: [main]
    paths:
      - CODESTRA_UPSTREAM.json
      - config/codestra/runtime.v1.json
      - .github/workflows/upstream-source-sync.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: postgres-exporter-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Codestra authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install pinned parser
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: Validate Codestra runtime contract
        run: python scripts/validate_repository_security.py

      - name: Import exact official upstream source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mapfile -t values < <(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('CODESTRA_UPSTREAM.json').read_text())
          print(data['upstream_clone_url'])
          print(data['upstream_ref'])
          print(data['import_path'])
          PY
          )
          UPSTREAM_URL="${values[0]}"
          UPSTREAM_REF="${values[1]}"
          IMPORT_PATH="${values[2]}"
          [[ "$UPSTREAM_URL" == 'https://github.com/prometheus-community/postgres_exporter.git' ]]
          [[ "$UPSTREAM_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMPORT_PATH" == upstream ]]

          rm -rf .codestra-upstream-src "$IMPORT_PATH"
          git init --quiet .codestra-upstream-src
          git -C .codestra-upstream-src remote add origin "$UPSTREAM_URL"
          GIT_LFS_SKIP_SMUDGE=1 git -C .codestra-upstream-src fetch --depth 1 --no-tags origin "$UPSTREAM_REF"
          git -C .codestra-upstream-src checkout --quiet --detach FETCH_HEAD
          UPSTREAM_SHA="$(git -C .codestra-upstream-src rev-parse HEAD)"
          [[ "$UPSTREAM_SHA" == "$UPSTREAM_REF" ]]
          UPSTREAM_TIMESTAMP="$(git -C .codestra-upstream-src show -s --format=%cI "$UPSTREAM_SHA")"
          rm -rf .codestra-upstream-src/.git
          mv .codestra-upstream-src "$IMPORT_PATH"

          export UPSTREAM_URL UPSTREAM_REF UPSTREAM_SHA UPSTREAM_TIMESTAMP
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('CODESTRA_UPSTREAM_LOCK.json').write_text(json.dumps({
              'schema_version': '1.0',
              'upstream_clone_url': os.environ['UPSTREAM_URL'],
              'upstream_ref': os.environ['UPSTREAM_REF'],
              'upstream_commit': os.environ['UPSTREAM_SHA'],
              'import_path': 'upstream',
              'synchronized_at': os.environ['UPSTREAM_TIMESTAMP'],
              'deployment_enabled': False,
              'secret_material_allowed_in_git': False,
          }, indent=2) + '\n')
          PY

          git config user.name 'codestra-upstream-sync'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          export GIT_AUTHOR_DATE="$UPSTREAM_TIMESTAMP"
          export GIT_COMMITTER_DATE="$UPSTREAM_TIMESTAMP"
          SYNC_BRANCH="sync/postgres-exporter-upstream-${UPSTREAM_SHA}"
          git switch --create "$SYNC_BRANCH"
          git fetch --depth 1 --no-tags "$UPSTREAM_URL" "$UPSTREAM_SHA"
          git rm -r --cached --quiet --ignore-unmatch upstream
          git read-tree --prefix=upstream/ "${UPSTREAM_SHA}^{tree}"
          git add CODESTRA_UPSTREAM_LOCK.json
          if git diff --cached --quiet; then
            echo 'Exact upstream snapshot already current.'
            exit 0
          fi
          git commit -m "vendor(postgres-exporter): Sync official upstream ${UPSTREAM_SHA}"

          LOCAL_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/${SYNC_BRANCH}" | awk '{print $1}')"
          if [[ -n "$REMOTE_SHA" ]]; then
            [[ "$REMOTE_SHA" == "$LOCAL_SHA" ]] || {
              echo 'Existing sync branch differs; refusing replacement.' >&2
              exit 3
            }
          else
            git push origin "HEAD:refs/heads/${SYNC_BRANCH}"
          fi

          mapfile -t OPEN_PRS < <(
            gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --head "$SYNC_BRANCH" --json number --jq '.[].number'
          )
          if (( ${#OPEN_PRS[@]} > 1 )); then
            echo 'Multiple open synchronization pull requests found.' >&2
            exit 3
          elif (( ${#OPEN_PRS[@]} == 0 )); then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "vendor(postgres-exporter): Sync reviewed official upstream ${UPSTREAM_SHA}" \
              --body "Pins and imports exact official PostgreSQL Exporter commit ${UPSTREAM_SHA}. The private, least-privilege runtime contract is preserved and deployment remains disabled. Normal source validation and independent review are required."
          fi
          gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
